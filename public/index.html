<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deepgram Realtime Notes</title>
    <style>
      body { font-family: system-ui, Arial; margin: 24px; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      #log, #notes { white-space: pre-wrap; border: 1px solid #ddd; padding: 12px; border-radius: 8px; }
      #log { min-height: 140px; }
      #notes { min-height: 220px; }
      input, select { padding: 8px; }
      button { padding: 8px 12px; cursor: pointer; }
      .hint { color: #666; font-size: 14px; }
    </style>
  </head>
  <body>
    <h2>Realtime Speech → Notes (Deepgram)</h2>

    <div class="row">
      <label>Room:</label>
      <input id="room" value="demo" />
      <label>Mode:</label>
      <select id="mode">
        <option value="viewer">Viewer</option>
        <option value="speaker">Speaker (mic)</option>
      </select>
      <button id="start">Connect</button>
      <button id="stop" disabled>Disconnect</button>
    </div>

    <p class="hint">
      Share the same room id with anonymous viewers. One tab can be speaker (streams mic), others are viewers.
    </p>

    <h3>Status</h3>
    <div id="log"></div>

    <h3>Notes</h3>
    <div id="notes"></div>

    <script src="/static/client.js"></script>
